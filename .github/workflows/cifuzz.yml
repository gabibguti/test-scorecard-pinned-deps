name: CIFuzz
on: workflow_dispatch:
permissions:
  contents: read
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@fd3ab6015eb1527422d92d360003895ad55b4234 # master
      with:
        oss-fuzz-project-name: 'test'
        dry-run: false
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@fd3ab6015eb1527422d92d360003895ad55b4234 # master
      with:
        oss-fuzz-project-name: 'test'
        fuzz-seconds: 300
        dry-run: false
